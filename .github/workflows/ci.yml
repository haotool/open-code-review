name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # Gate 1 — upstream sync health (ADR ④)
      - name: Build all packages
        run: go build ./...

      - name: Format check
        run: make fmt-check

      - name: Doc whitespace check
        run: make doc-whitespace-check

      - name: Vet
        run: make vet

      # Gate 2 — test suite (S6); race + same package filter as Makefile test target
      - name: Test
        run: make test

      - name: Coverage threshold
        run: make coverage

      - name: Govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./cmd/ocr-delegate/... ./internal/delegatecli/... ./internal/preview/...

      - name: Install ripgrep
        run: |
          if command -v rg >/dev/null 2>&1; then
            echo "ripgrep already installed"
          elif command -v apt-get >/dev/null 2>&1; then
            sudo apt-get update && sudo apt-get install -y ripgrep
          elif command -v brew >/dev/null 2>&1; then
            brew install ripgrep
          else
            echo "FAIL: ripgrep not available"; exit 1
          fi

      - name: Plugin skill package check
        run: bash test/ci/check-plugin-skills.sh

      # Gate 5 — Delegate Edition surface guard; prevent removed upstream
      # distribution entry points from being reintroduced by syncs.
      - name: Delegate surface check
        run: bash test/ci/check-delegate-surface.sh

      - name: E2E dry-run
        # S4: ripgrep checks npm-free canonical paths + delegate-only skill discipline
        run: bash test/e2e/dryrun.sh

      # Gate 3 — dependency closure (ADR ③)
      - name: Check ocr-delegate dependency closure
        run: |
          count="$(go list -deps ./cmd/ocr-delegate | grep -cE 'open-code-review/internal/(llm|llmloop|telemetry|mcp|viewer|session)' || true)"
          if [ "$count" -ne 0 ]; then
            echo "FAIL: ocr-delegate pulls $count forbidden internal packages"
            go list -deps ./cmd/ocr-delegate | grep -E 'open-code-review/internal/(llm|llmloop|telemetry|mcp|viewer|session)' || true
            exit 1
          fi
          echo "PASS-closure"

      # Gate 4 — artifact string scan for provider endpoint domains (T3)
      - name: Build ocr-delegate and scan strings
        run: |
          make build
          count="$(strings dist/ocr-delegate | grep -cE 'dashscope|aliyuncs|volces|bigmodel|moonshot\.cn|xiaomimimo|minimaxi|qianfan|tencentmaas|xf-yun' || true)"
          if [ "$count" -ne 0 ]; then
            echo "FAIL: dist/ocr-delegate contains $count forbidden provider domain strings"
            strings dist/ocr-delegate | grep -E 'dashscope|aliyuncs|volces|bigmodel|moonshot\.cn|xiaomimimo|minimaxi|qianfan|tencentmaas|xf-yun' || true
            exit 1
          fi
          echo "PASS-strings"
